apiVersion: apps/v1
kind: Deployment

metadata:
  name: react-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: react-app

  template:
    metadata:
      labels:
        app: react-app

    spec:
      containers:
        - name: react-app
          image: 295028317770.dkr.ecr.us-east-1.amazonaws.com/aws-devops-handson:latest

          ports:
            - containerPort: 80
