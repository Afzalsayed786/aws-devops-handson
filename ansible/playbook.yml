---
- name: Deploy React App
  hosts: web
  become: true

  tasks:

    - name: Update apt package list
      apt:
        update_cache: true

    - name: Create 2GB swap file
      shell: |
        if [ ! -f /swapfile ]; then
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
        fi

        if ! swapon --show | grep -q "/swapfile"; then
          swapon /swapfile
        fi

        if ! grep -q "^/swapfile none swap sw 0 0$" /etc/fstab; then
          echo "/swapfile none swap sw 0 0" >> /etc/fstab
        fi
      args:
        executable: /bin/bash

    - name: Install Node.js, npm and Git
      apt:
        name:
          - nodejs
          - npm
          - git
        state: present

    - name: Remove old application directory
      file:
        path: /home/ubuntu/aws-devops-handson
        state: absent

    - name: Clone React application
      become_user: ubuntu
      git:
        repo: "https://github.com/Afzalsayed786/aws-devops-handson.git"
        dest: /home/ubuntu/aws-devops-handson
        version: main

    - name: Install React application dependencies
      become_user: ubuntu
      npm:
        path: /home/ubuntu/aws-devops-handson

    - name: Start React application
      become_user: ubuntu
      shell: |
        cd /home/ubuntu/aws-devops-handson
        nohup npm start > /home/ubuntu/react-app.log 2>&1 &
      args:
        executable: /bin/bash
